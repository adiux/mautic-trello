name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto, patch, minor, major)"
        required: true
        default: auto
        type: choice
        options: [auto, patch, minor, major]
      post_to_slack:
        description: "Post release notes to Slack"
        required: false
        default: false
        type: boolean
      source_sha:
        description: "Full source commit SHA that this release must directly follow"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH || 'main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_BRANCH }}

      - name: Sync with origin branch
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch origin "${RELEASE_BRANCH}"
          git reset --hard "origin/${RELEASE_BRANCH}"
          [[ "$(git rev-parse HEAD)" == "${SOURCE_SHA}" ]]

      - name: Use Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Ensure jq is installed
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate package version
        run: |
          CURRENT_VERSION="$(jq -r '.version // empty' package.json)"
          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" = "null" ]; then
            echo "Invalid version in package.json: $CURRENT_VERSION"
            exit 1
          fi
          if ! [[ "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "Version is not semver-like: $CURRENT_VERSION"
            exit 1
          fi

      - name: Run standard-version
        run: |
          STANDARD_VERSION_ARGS="--no-verify --skip.commit --skip.tag --infile CHANGELOG.md --packageFiles package.json --bumpFiles package.json"
          if [ "${{ inputs.bump }}" = "auto" ]; then
            npx standard-version $STANDARD_VERSION_ARGS
          else
            npx standard-version -r "${{ inputs.bump }}" $STANDARD_VERSION_ARGS
          fi

      - name: Capture new version
        if: always()
        run: echo "NEW_VERSION=$(jq -r .version package.json)" >> "$GITHUB_ENV"

      - name: Sync version files
        run: |
          chmod +x scripts/sync-version-files.js
          ./scripts/sync-version-files.js "$NEW_VERSION"

      - name: Detect release changes
        id: release_changes
        run: |
          # Skip release/tag/notifications unless there's a release-worthy commit
          # since the last tag. Release-worthy is every conventional type except
          # docs/chore/test, so a type added to commitlint.config.cjs counts
          # without needing an edit here. Merges and non-conventional subjects
          # never trigger a release on their own.
          # standard-version always bumps package.json/CHANGELOG.md, even for
          # ignored-type-only commits or no commits at all, so a plain `git diff`
          # here would never catch an empty release.
          LAST_TAG="$(git tag --merged HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ -z "$LAST_TAG" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            RELEASE_WORTHY="$(git log "${LAST_TAG}..HEAD" --no-merges --pretty=%s \
              | grep -E '^[a-z]+(\(.+\))?!?:' \
              | grep -Ev '^(docs|chore|test)(\(.+\))?!?:' || true)"
            if [ -z "$RELEASE_WORTHY" ]; then
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "No release-worthy commits since ${LAST_TAG}. Skipping release, Google Sheets, and Slack."
            else
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Extract release notes
        if: steps.release_changes.outputs.has_changes == 'true'
        run: |
          chmod +x scripts/extract-release-notes.sh
          ./scripts/extract-release-notes.sh CHANGELOG.md > release_notes.md

      - name: Get release tag
        id: tag
        if: steps.release_changes.outputs.has_changes == 'true'
        run: echo "name=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit release
        if: steps.release_changes.outputs.has_changes == 'true'
        run: |
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/v${NEW_VERSION}" >/dev/null; then
            echo "Release tag v${NEW_VERSION} already exists. Reconcile it with ${RELEASE_BRANCH} before rerunning this workflow." >&2
            exit 1
          fi
          for file in CHANGELOG.md package.json package-lock.json Config/config.php; do
            [ -f "$file" ] && git add "$file"
          done
          git commit -m "chore(release): v${NEW_VERSION}"

      - name: Push release commit
        if: steps.release_changes.outputs.has_changes == 'true'
        run: git push origin "HEAD:${RELEASE_BRANCH}"

      - name: Tag and push release
        if: steps.release_changes.outputs.has_changes == 'true'
        run: |
          git tag -a "v${NEW_VERSION}" -m "v${NEW_VERSION}"
          git push origin "refs/tags/v${NEW_VERSION}"

      - name: Create GitHub Release
        if: steps.release_changes.outputs.has_changes == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body_path: release_notes.md
          generate_release_notes: false
          prerelease: ${{ contains(env.NEW_VERSION, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post release to Google Sheets
        if: steps.release_changes.outputs.has_changes == 'true'
        env:
          SHEETS_WEBHOOK_URL: ${{ vars.SHEETS_WEBHOOK_URL }}
          SHEETS_WEBHOOK_TOKEN: ${{ secrets.SHEETS_WEBHOOK_TOKEN }}
          TAG_NAME: ${{ steps.tag.outputs.name }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          chmod +x scripts/post-release-to-google-sheets.sh
          ./scripts/post-release-to-google-sheets.sh release_notes.md

      - name: Post release notes to Slack
        if: steps.release_changes.outputs.has_changes == 'true' && inputs.post_to_slack
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHANGELOG_URL: ${{ vars.CHANGELOG_SHEET_URL }}
        run: |
          chmod +x scripts/post-release-notes-to-slack.sh
          ./scripts/post-release-notes-to-slack.sh release_notes.md
